version: "2"
# One entry per database; each generates its own package under internal/database/<name>/sqlc.
sql:
  - name: "primary"
    engine: "postgresql"
    queries: "internal/database/primary/queries"
    schema:
      - "internal/database/primary/migrations"
      - "internal/database/primary/functions"
    gen:
      go:
        package: "sqlc"
        out: "internal/database/primary/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "snake"
        emit_interface: false
        emit_empty_slices: true
        emit_db_tags: true
        emit_pointers_for_null_types: true
        initialisms: ["id", "uuid", "url", "ip"]
        overrides:
          # ==== json ====
          - db_type: "json"
            go_type: "encoding/json.RawMessage"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"

          # ==== uuid ====
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

          # ==== timestamptz ====
          - db_type: "timestamptz"
            go_type: "time.Time"
            nullable: false
          - db_type: "timestamptz"
            go_type:
              type: "time.Time"
              pointer: true
            nullable: true
